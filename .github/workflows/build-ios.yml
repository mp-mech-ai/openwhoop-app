name: Build iOS IPA

on:
  push:
    branches: [master]
  workflow_dispatch: # allows manual trigger from the Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Rust ──────────────────────────────────────────────────────────────
      - name: Install Rust (stable) with iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Cargo registry & build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Node / pnpm ───────────────────────────────────────────────────────
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: |
          pnpm config set dangerouslyAllowAllBuilds true
          pnpm install

      # ── Tauri CLI ─────────────────────────────────────────────────────────
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # ── iOS project init ──────────────────────────────────────────────────
      - name: Initialise Tauri iOS project
        run: pnpm tauri ios init

      # ── Patch pbxproj for unsigned build ──────────────────────────────────
      # Tauri does NOT forward -- flags to xcodebuild (confirmed from build logs),
      # so we must disable signing directly in the project file.
      # Python is more reliable than sed for this kind of structured text.
      - name: Patch Xcode project for unsigned build
        run: |
          PBXPROJ=$(find src-tauri/gen/apple -name "project.pbxproj" | head -1)
          echo "Patching: $PBXPROJ"

          python3 - "$PBXPROJ" << 'EOF'
          import sys, re

          path = sys.argv[1]
          with open(path) as f:
              c = f.read()

          replacements = {
              r'CODE_SIGN_STYLE\s*=\s*\w+\s*;':      'CODE_SIGN_STYLE = Manual;',
              r'DEVELOPMENT_TEAM\s*=\s*[^;]*;':       'DEVELOPMENT_TEAM = "";',
              r'CODE_SIGNING_ALLOWED\s*=\s*\w+\s*;':  'CODE_SIGNING_ALLOWED = NO;',
              r'CODE_SIGNING_REQUIRED\s*=\s*\w+\s*;': 'CODE_SIGNING_REQUIRED = NO;',
              r'CODE_SIGN_IDENTITY\s*=\s*[^;]*;':     'CODE_SIGN_IDENTITY = "";',
          }

          for pattern, replacement in replacements.items():
              c = re.sub(pattern, replacement, c)

          # If CODE_SIGNING_ALLOWED is absent entirely, inject it after CODE_SIGN_STYLE
          if 'CODE_SIGNING_ALLOWED' not in c:
              c = c.replace(
                  'CODE_SIGN_STYLE = Manual;',
                  'CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;'
              )

          with open(path, 'w') as f:
              f.write(c)

          print("Patched. Resulting signing settings:")
          for line in c.splitlines():
              if any(k in line for k in ['CODE_SIGN', 'DEVELOPMENT_TEAM']):
                  print(' ', line.strip())
          EOF

      # ── Build (unsigned) ──────────────────────────────────────────────────
      - name: Build iOS app (unsigned)
        run: pnpm tauri ios build --target aarch64

      # ── Package into IPA ──────────────────────────────────────────────────
      - name: Package .app → .ipa
        run: |
          APP_PATH=$(find src-tauri/gen/apple -name "*.app" | grep -v ".xcarchive" | head -1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r openwhoop.ipa Payload/
          rm -rf Payload
          echo "IPA size: $(du -sh openwhoop.ipa | cut -f1)"

      # ── Upload artefact ───────────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: openwhoop-ios-${{ github.sha }}
          path: openwhoop.ipa
          retention-days: 30