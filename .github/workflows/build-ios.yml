name: Build iOS IPA

on:
  push:
    branches: [master]
  workflow_dispatch: # allows manual trigger from the Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Rust ──────────────────────────────────────────────────────────────
      - name: Install Rust (stable) with iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Cargo registry & build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Node / pnpm ───────────────────────────────────────────────────────
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: |
          pnpm config set dangerouslyAllowAllBuilds true
          pnpm install

      # ── Tauri CLI ─────────────────────────────────────────────────────────
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # ── iOS project init ──────────────────────────────────────────────────
      - name: Initialise Tauri iOS project
        run: pnpm tauri ios init

      # ── Patch pbxproj ─────────────────────────────────────────────────────
      # 1. Disable code signing (Tauri does NOT forward -- flags to xcodebuild)
      # 2. Inject -framework CoreBluetooth into OTHER_LDFLAGS so btleplug
      #    symbols resolve (Rust #[link] attributes don't propagate to Xcode)
      - name: Patch Xcode project
        run: |
          PBXPROJ=$(find src-tauri/gen/apple -name "project.pbxproj" | head -1)
          echo "Patching: $PBXPROJ"

          python3 - "$PBXPROJ" << 'EOF'
          import sys, re

          path = sys.argv[1]
          with open(path) as f:
              c = f.read()

          # ── Signing ──────────────────────────────────────────────────────
          c = re.sub(r'CODE_SIGN_STYLE\s*=\s*\w+\s*;',      'CODE_SIGN_STYLE = Manual;', c)
          c = re.sub(r'DEVELOPMENT_TEAM\s*=\s*[^;]*;',       'DEVELOPMENT_TEAM = "";', c)
          c = re.sub(r'CODE_SIGNING_ALLOWED\s*=\s*\w+\s*;',  'CODE_SIGNING_ALLOWED = NO;', c)
          c = re.sub(r'CODE_SIGNING_REQUIRED\s*=\s*\w+\s*;', 'CODE_SIGNING_REQUIRED = NO;', c)
          c = re.sub(r'CODE_SIGN_IDENTITY\s*=\s*[^;]*;',     'CODE_SIGN_IDENTITY = "";', c)

          if 'CODE_SIGNING_ALLOWED' not in c:
              c = c.replace(
                  'CODE_SIGN_STYLE = Manual;',
                  'CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;'
              )

          # ── CoreBluetooth framework ───────────────────────────────────────
          # btleplug needs CoreBluetooth but Tauri's generated project doesn't
          # add it automatically; Rust #[link] attrs don't propagate to Xcode.
          if 'CoreBluetooth' not in c:
              # Append to existing OTHER_LDFLAGS = "..." lines
              patched = re.sub(
                  r'OTHER_LDFLAGS = "([^"]*)"',
                  r'OTHER_LDFLAGS = "\1 -framework CoreBluetooth"',
                  c
              )
              if patched != c:
                  c = patched
              else:
                  # No OTHER_LDFLAGS at all — inject after each DEVELOPMENT_TEAM line
                  c = re.sub(
                      r'(DEVELOPMENT_TEAM = "";)',
                      r'\1\n\t\t\t\tOTHER_LDFLAGS = "$(inherited) -framework CoreBluetooth";',
                      c
                  )

          with open(path, 'w') as f:
              f.write(c)

          print("Patch complete. Relevant settings:")
          for line in c.splitlines():
              if any(k in line for k in ['CODE_SIGN', 'DEVELOPMENT_TEAM', 'OTHER_LDFLAGS', 'CoreBluetooth']):
                  print(' ', line.strip())
          EOF

      # ── Build (unsigned) ──────────────────────────────────────────────────
      - name: Build iOS app (unsigned)
        run: pnpm tauri ios build --target aarch64

      # ── Package into IPA ──────────────────────────────────────────────────
      - name: Package .app → .ipa
        run: |
          APP_PATH=$(find src-tauri/gen/apple -name "*.app" | grep -v ".xcarchive" | head -1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r openwhoop.ipa Payload/
          rm -rf Payload
          echo "IPA size: $(du -sh openwhoop.ipa | cut -f1)"

      # ── Upload artefact ───────────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: openwhoop-ios-${{ github.sha }}
          path: openwhoop.ipa
          retention-days: 30